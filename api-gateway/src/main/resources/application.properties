spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=machine-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/machines/**

spring.cloud.gateway.routes[2].id=shift-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shifts/**

spring.cloud.discovery.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false

eureka.client.enabled=false

jwt.secret=ThisIsASecretKeyForJWTGenerationForForgeWatchProject
