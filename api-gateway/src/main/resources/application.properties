spring.application.name=api-gateway
server.port=8080

# ==================== GATEWAY ROUTES ====================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=machine-service
spring.cloud.gateway.routes[1].uri=${MACHINE_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/machines/**

spring.cloud.gateway.routes[2].id=shift-service
spring.cloud.gateway.routes[2].uri=${SHIFT_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shifts/**

spring.cloud.gateway.routes[3].id=defect-service
spring.cloud.gateway.routes[3].uri=${DEFECT_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/defects/**

spring.cloud.gateway.routes[4].id=alert-service
spring.cloud.gateway.routes[4].uri=${ALERT_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

spring.cloud.discovery.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false
eureka.client.enabled=false

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJWTGenerationForForgeWatchProject}

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=API Gateway - ForgeWatch Factory Monitoring System

# ==================== LOGGING ====================
logging.level.com.forgewatch=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
