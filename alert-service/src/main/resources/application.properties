spring.application.name=alert-service
server.port=8085

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
#spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=email
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

twilio.account-sid=account-sid
twilio.auth-token=auth-token
twilio.verify.service-sid=service-sid
twilio.from-phone-number=number
twilio.messaging-service-sid=messaging-service-sid

notification.supervisor.email=email
notification.supervisor.phone=number