spring.application.name=alert-service
server.port=8085

# ==================== RABBITMQ ====================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ==================== REDIS ====================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ==================== MAIL ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:email}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==================== TWILIO ====================
twilio.account-sid=${TWILIO_ACCOUNT_SID:account-sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:auth-token}
twilio.verify.service-sid=${TWILIO_VERIFY_SERVICE_SID:service-sid}
twilio.from-phone-number=${TWILIO_FROM_PHONE_NUMBER:number}
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:messaging-service-sid}

# ==================== NOTIFICATION ====================
notification.supervisor.email=${SUPERVISOR_EMAIL:email}
notification.supervisor.phone=${SUPERVISOR_PHONE:number}

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=1.0.0
info.app.description=Alert Service - ForgeWatch Factory Monitoring System

# ==================== SWAGGER / OPENAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=true

# ==================== LOGGING ====================
logging.level.com.forgewatch=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
